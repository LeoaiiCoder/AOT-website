<!DOCTYPE html>
<html>

<head>
    <title>Episode 1</title>

    <style>
        body{ 

        background-image:url("background.png");

        background-size: cover;
        background-position: center ;
        background-repeat: no-repeat;
         height: 100vh;
    margin: 0;

        color: black;
         text-align: center;
    }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: crimson;
        }

        .section {
            background-color: #1c1c1c;
            padding: 15px;
            margin: 20px 0;
            border-radius: 10px;
        }

        textarea {
            width: 100%;
            height: 200px;
            background-color: #000;
            color: white;
            border: 1px solid gray;
            padding: 10px;
            font-size: 16px;
            resize: vertical;
        }

        input[type="file"] {
            margin-top: 10px;
        }

        img {
            width: 100%;
            margin-top: 10px;
            border-radius: 8px;
        }
    </style>

</head>

<body>

<div class="container">

    <h1>Episode1 (To You, in 2,000 Years - The Fall of Shiganshina: Part 1)</h1>

    <!-- NOTES SECTION -->
    <div class="section">
        <h2>Your Notes</h2>
        <textarea placeholder="Write everything you understood about this episode..."></textarea>
    </div>

    <!-- SCREENSHOTS SECTION -->
    <div class="section">
        <h2>Screenshots</h2>

        <input type="file" accept="image/*" onchange="loadImage(event)">

        <img id="output" />

    </div>

</div>

<script>
function loadImage(event) {
    const image = document.getElementById('output');
    image.src = URL.createObjectURL(event.target.files[0]);
}
</script>

</body>

</html>
