<div class="container">

    <h1>Episode7 (Close Combat)</h1>

    <!-- NOTES SECTION -->
    <div class="section">
        <h2>Your Notes</h2>
        <textarea id="notes" placeholder="Write everything you understood about this episode..."></textarea>
    </div>

    <!-- SCREENSHOTS SECTION -->
    <div class="section">
        <h2>Screenshots</h2>

        <input type="file" accept="image/*" onchange="loadImage(event)">

        <img id="output" />

    </div>

</div>

<script>
function loadImage(event) {
    const image = document.getElementById('output');
    image.src = URL.createObjectURL(event.target.files[0]);
}
</script>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getFirestore,
  doc,
  setDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBRHPWG_sMnVaME60xZihO60BKLwMVywlA",
  authDomain: "aot-website-notes-saveup.firebaseapp.com",
  projectId: "aot-website-notes-saveup",
  storageBucket: "aot-website-notes-saveup.firebasestorage.app",
  messagingSenderId: "1038588539631",
  appId: "1:1038588539631:web:570905d32198ec0dee611a",
  measurementId: "G-ZRPXM1B7VY"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const notes = document.getElementById("notes");

onAuthStateChanged(auth, async (user) => {

    if (!user) {

        alert("Please sign in first.");
        window.location.href = "index.html";
        return;

    }

    console.log("UID:", user.uid);

    const docRef = doc(
        db,
        "users",
        user.uid,
        "episodes",
        "S2episode7"
    );

    const docSnap = await getDoc(docRef);

    if (docSnap.exists()) {
        notes.value = docSnap.data().notes;
    }

    notes.addEventListener("input", async function () {

        await setDoc(docRef, {
            notes: notes.value
        });

    });

});

</script>
